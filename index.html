<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carnet du Tour</title>
<meta name="theme-color" content="#F6F3E3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: appli iOS — grand titre par écran, listes groupées sur fond gris, barre d'onglets translucide en bas */
:root{
  /* Light Gold E9D985 · Muted Olive B2BD7E · Sage Green 749C75 · Dusty Lavender 6A5D7B · Vintage Grape 5D4A66 */
  --bg:#F6F3E3; --surface:#FFFEF8; --ink:#2F2537; --muted:#6A5D7B; --line:#E6E1C8; --fill:#EFEBCD;
  --accent:#749C75; --accent-ink:#FFFFFF; --accent-soft:#F4ECBC; --red:#A34A5E; --gold:#E9D985; --blue:#5D4A66; --oak:#B2BD7E; --grape:#5D4A66;
  --tabbar:rgba(246,243,227,.88);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
  --round:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1D1823; --surface:#2A2331; --ink:#F6F1D8; --muted:#B4AAC3; --line:#3A3145; --fill:#3A3145;
  --accent:#8DB58E; --accent-ink:#13201A; --accent-soft:#3A3A2B; --red:#E48DA0; --gold:#E9D985; --blue:#B4AAC3; --oak:#6A5D7B; --grape:#8C7A9C;
  --tabbar:rgba(29,24,35,.88); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1823; --surface:#2A2331; --ink:#F6F1D8; --muted:#B4AAC3; --line:#3A3145; --fill:#3A3145;
  --accent:#8DB58E; --accent-ink:#13201A; --accent-soft:#3A3A2B; --red:#E48DA0; --gold:#E9D985; --blue:#B4AAC3; --oak:#6A5D7B; --grape:#8C7A9C;
  --tabbar:rgba(29,24,35,.88); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:17px;line-height:1.35;letter-spacing:-.01em;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}
main{display:flex;flex-direction:column;gap:22px;padding-block:18px 8px}
button{font:inherit;color:inherit}

/* Titres */
.ptitle{display:flex;flex-direction:column;gap:2px;padding-top:8px}
.ptitle .date{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;color:var(--muted)}
h1{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:0}
h2{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:0;text-wrap:balance}
h3{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:8px}
.sec>.eyebrow,.sec>.spread>.eyebrow{text-transform:uppercase;font-size:12.5px;letter-spacing:.03em;padding-left:4px}
.note{font-size:14px;color:var(--muted);line-height:1.4}
.muted{color:var(--muted)}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* Surfaces */
.card{background:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.list{background:var(--surface);border-radius:14px;overflow:hidden}
.card .list{background:transparent;border-radius:0;margin:0 -16px}
.item{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 14px;position:relative}
.item+.item::before{content:"";position:absolute;top:0;right:0;left:56px;height:1px;background:var(--line)}
.drill{flex:1;min-width:0;text-align:left;background:none;border:0;padding:6px 0;cursor:pointer;display:flex;align-items:center;gap:10px}
.drill .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.drill b{font-weight:600;font-size:16.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drill span.m{font-size:13.5px;color:var(--muted)}
.chev{flex:none;width:8px;height:14px;color:var(--oak)}
.rec{flex:none;font-family:var(--round);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;text-align:right;line-height:1.1}
.rec small{display:block;font-family:var(--font);font-weight:500;font-size:11px;color:var(--muted)}

/* Case à cocher */
.check{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--oak);background:transparent;cursor:pointer;display:grid;place-items:center;color:transparent;padding:0}
.check svg{width:15px;height:15px}
.check.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Boutons */
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:15px 18px;font-weight:600;font-size:17px;cursor:pointer;text-align:center}
.btn.acc{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--accent)}
.card .btn.ghost,.sheet .btn.ghost{background:var(--fill)}
.btn.red{background:var(--red);color:#fff}
.btn.green{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4}
.btn.sm{padding:9px 14px;font-size:15px;border-radius:10px}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:15px;cursor:pointer;padding:4px 0}
.btn:focus-visible,.chip:focus-visible,.check:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.drill:focus-visible,.seg button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn:active,.drill:active,.chip:active{opacity:.7}

/* Puces et segments */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.sheet .chips,.card .chips{margin-inline:0;padding-inline:0;flex-wrap:wrap}
.chip{flex:none;border:0;background:var(--surface);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px}
.sheet .chip,.card .chip{background:var(--fill)}
.chip.on{background:var(--grape);color:#fff}
.ic{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff}
.ic svg{width:17px;height:17px}
.chip .ic{width:22px;height:22px;border-radius:6px}.chip .ic svg{width:13px;height:13px}

/* Carte du jour */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--round);font-weight:800;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.ring .v small{display:block;font-size:11px;font-weight:600;color:var(--muted);font-family:var(--font);margin-top:2px}
.hero .t{min-width:0;display:flex;flex-direction:column;gap:4px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.pill{font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--fill);color:var(--ink)}
.pill.g{background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--oak)}
.weekbar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.weekbar i{height:4px;border-radius:2px;background:var(--fill)}
.weekbar i.on{background:var(--accent)}
.weekbar i.past{background:var(--oak)}
.done-banner{background:var(--accent-soft);color:var(--ink);border:1px solid var(--oak);border-radius:12px;padding:12px 14px;font-weight:600;font-size:15px}
.prog{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;width:100%;background:var(--fill);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* Tuiles de stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.card .stat{background:var(--fill)}
.stat b{font-family:var(--round);font-size:26px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:12.5px;color:var(--muted);font-weight:500}
.big-num{font-family:var(--round);font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}

/* Barre d'onglets */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--tabbar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 6px;cursor:pointer;font-size:10.5px;font-weight:600}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--accent)}

/* Fiches (bottom sheet) */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);color:var(--ink);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.sheet::before{content:"";align-self:center;width:38px;height:5px;border-radius:3px;background:var(--oak);flex:none}
.sheet .card{background:var(--surface)}
.sheet .list{background:var(--surface)}
.x{background:var(--fill);border:0;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;padding:6px 12px;border-radius:999px}
input[type=number],input[type=text],input[type=date],textarea,select{font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:0;border-radius:12px;padding:12px 14px;width:100%;min-width:0}
.card input,.card textarea,.card select{background:var(--fill)}
textarea{min-height:80px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.counter{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0}
.counter .big{font-family:var(--round);font-weight:800;font-size:96px;line-height:.95;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .btn{padding:22px 10px;font-size:19px;border-radius:18px}

/* Carte de score */
.scroll{overflow-x:auto}
table.sc{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;min-width:100%}
table.sc th,table.sc td{padding:6px 0;min-width:30px;text-align:center;font-size:14px}
table.sc th{color:var(--muted);font-weight:600;font-size:12px}
table.sc tr+tr td{border-top:1px solid var(--line)}
.mk{display:inline-grid;place-items:center;width:26px;height:26px;font-weight:600}
.mk.bird{border:1.5px solid var(--accent);border-radius:50%;color:var(--accent)}
.mk.eagle{background:var(--accent);color:var(--accent-ink);border-radius:50%}
.mk.bog{border:1.5px solid var(--muted);border-radius:4px}
.mk.dbl{background:var(--muted);color:var(--surface);border-radius:4px}
.mk.cur{background:var(--ink);color:var(--bg);border-radius:8px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border-radius:14px;padding:8px}
.stepper button{width:56px;height:56px;border-radius:12px;border:0;background:var(--fill);color:var(--ink);font-size:28px;cursor:pointer}
.stepper b{font-family:var(--round);font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}

/* Carnet, progrès */
.grid3{display:grid;grid-template-columns:auto repeat(3,1fr);gap:8px;align-items:center}
.grid3 input{text-align:center;padding:12px 4px;font-weight:600;font-variant-numeric:tabular-nums}
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.badge{background:var(--surface);border-radius:14px;padding:12px;font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center}
.badge .ic{background:var(--fill);color:var(--muted)}
.badge b{display:block;font-size:14.5px;color:var(--ink);font-weight:600}
.badge.got .ic{background:var(--gold);color:var(--ink)}
.badge:not(.got){opacity:.6}
.jal{background:var(--surface);border-radius:14px;overflow:hidden}
.jl{display:grid;grid-template-columns:30px 1fr auto;gap:12px;padding:12px 14px;align-items:center;position:relative}
.jl+.jl::before{content:"";position:absolute;top:0;right:0;left:56px;height:1px;background:var(--line)}
.jl .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--fill);font-weight:700;font-size:14px;color:var(--muted)}
.jl.now .n{background:var(--grape);color:#fff}
.jl.ok .n{background:var(--accent);color:var(--accent-ink)}
.jl b{font-size:15.5px;font-weight:600}
.jl .t{font-family:var(--round);font-weight:700;font-size:15px;text-align:right;color:var(--muted)}
.jl.now .t{color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;z-index:30;font-weight:600;font-size:15px;max-width:90%;box-shadow:0 8px 24px rgba(0,0,0,.18)}
svg.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:28px 16px}
.empty .ic{width:52px;height:52px;border-radius:14px}.empty .ic svg{width:28px;height:28px}
@media (prefers-reduced-motion:no-preference){.check{transition:background .15s,border-color .15s}.ring circle{transition:stroke-dashoffset .5s}.btn,.chip,.drill{transition:opacity .12s}}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:12px}
.sw{aspect-ratio:1;max-width:100%;border-radius:50%;border:0;cursor:pointer;position:relative;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.sw.custom{display:grid;place-items:center;background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);overflow:hidden}
.sw.custom span{color:#fff;font-weight:800;font-size:20px;text-shadow:0 1px 3px rgba(0,0,0,.5);pointer-events:none}
.sw.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--fill);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:8px;font-weight:600;font-size:15px;cursor:pointer}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
</style>

<div class="wrap">
  <main id="view"></main>
</div>

<nav class="tabs" id="tabs">
  <button class="tab on" data-t="jour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Aujourd'hui</button>
  <button class="tab" data-t="exos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2" fill="currentColor"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor"/><circle cx="4.5" cy="18" r="1.2" fill="currentColor"/></svg>Exos</button>
  <button class="tab" data-t="parcours"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V3"/><path d="M6 3l12 5-12 5"/><path d="M3 22h8"/></svg>Parcours</button>
  <button class="tab" data-t="progres"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Progrès</button>
  <button class="tab" data-t="carnet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4a2 2 0 012-2h12v18H7a2 2 0 00-2 2z"/><path d="M5 20V4"/><path d="M9 7h6"/></svg>Carnet</button>
</nav>

<script>
/* ---------- Contenu ---------- */
const CATS={putt:"Putting",wedge:"Wedges",green:"Autour du green",fers:"Fers",drive:"Drive",mental:"Parcours & mental",etir:"Étirements"};
const ST=(n,s,cue,sides)=>({n,s,cue,sides:!!sides});
const ROUTINES={
 soir:{name:"Étirements du soir",steps:[
  ST("Respiration bras levés",60,"Debout, pieds largeur de hanches. Monte les bras en inspirant 4 s, redescends-les en soufflant 6 s."),
  ST("Inclinaison latérale",45,"Bras au-dessus de la tête, attrape un poignet et penche-toi sur le côté opposé, sans tourner le buste.",1),
  ST("Trapèzes",30,"Assis ou debout, laisse l'oreille descendre vers l'épaule. Pose la main sur la tête sans tirer et laisse l'autre épaule descendre vers le sol.",1),
  ST("Releveur de l'omoplate",30,"Tourne la tête à 45° et regarde vers ton aisselle. La main pèse légèrement sur l'arrière de la tête, l'autre bras tire vers le bas.",1),
  ST("Épaule bras croisé",45,"Ramène un bras tendu devant la poitrine et presse-le avec l'autre avant-bras, épaule basse.",1),
  ST("Triceps derrière la tête",30,"Main dans le dos derrière la tête, l'autre main pousse doucement le coude vers le bas.",1),
  ST("Pectoraux à la porte",45,"Avant-bras posé sur l'encadrement d'une porte, coude à hauteur d'épaule. Avance doucement le buste.",1),
  ST("Mains jointes dans le dos",45,"Croise les doigts derrière les fesses, bras tendus, et éloigne les mains du dos en ouvrant la poitrine. Menton rentré."),
  ST("Pince debout relâchée",60,"Genoux légèrement fléchis, laisse tomber le buste vers le sol, bras ballants ou coudes croisés. Laisse la tête lourde."),
  ST("Fente debout",45,"Grand pas en avant, genou arrière légèrement fléchi. Rentre le bassin et serre le fessier arrière, bras au ciel.",1),
  ST("Figure 4 debout",45,"Main au mur, pose la cheville sur le genou opposé et descends comme pour t'asseoir, dos droit.",1),
  ST("Torsion debout relâchée",60,"Pieds écartés, laisse les bras ballants s'enrouler autour de toi en tournant d'un côté puis de l'autre, de plus en plus lentement."),
 ]},
 mob:{name:"Grosse mobilité",steps:[
  ST("Respiration bras levés",60,"Debout, monte les bras en inspirant 4 s, redescends en soufflant 6 s. Tu poses le corps avant de le faire bouger."),
  ST("Cercles de hanches",60,"Mains sur les hanches, dessine de grands cercles avec le bassin, 10 dans un sens, 10 dans l'autre."),
  ST("Rotation en posture de golf",90,"Prends ta posture d'adresse, un club en travers des épaules. Tourne lentement comme au backswing puis au finish, bassin le plus stable possible."),
  ST("Fente et rotation",60,"Grande fente, bras tendus devant toi. Tourne le buste vers la jambe avant, tiens, reviens. Puis reste tourné.",1),
  ST("Pigeon sur table",90,"Pose la jambe pliée à plat sur une table ou un lit, l'autre pied au sol. Penche le buste au-dessus de la jambe pliée, dos droit.",1),

/* ---------- Stockage : base de l'artifact (privée par personne), sinon le navigateur ---------- */
const Store={docs:{},db:null,col:null,dirty:{},timers:{},chain:Promise.resolve(),mode:"local"};
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function getDoc(id,def){if(!Store.docs[id])Store.docs[id]=def?JSON.parse(JSON.stringify(def)):{};return Store.docs[id]}
function save(id){
  Store.dirty[id]=true;
  if(Store.mode==="local"){const ids=new Set(lsGet("cdt:ids")||[]);ids.add(id);lsSet("cdt:ids",[...ids]);lsSet("cdt:"+id,Store.docs[id]);Store.dirty[id]=false;return}
  clearTimeout(Store.timers[id]);
  Store.timers[id]=setTimeout(()=>{
    Store.chain=Store.chain.then(async()=>{
      const data=JSON.parse(JSON.stringify(Store.docs[id]));
      try{await Store.col.doc(id).set(data)}catch(e){
        if(e&&e.code==="quota_exceeded")toast("Stockage plein : impossible d'enregistrer");
        else if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,800+Math.random()*800));try{await Store.col.doc(id).set(data)}catch(_){toast("Pas de connexion, réessaie plus tard")}}
      }
      Store.dirty[id]=false;
    });
  },500);
}
function loadLocal(){(lsGet("cdt:ids")||[]).forEach(id=>{const v=lsGet("cdt:"+id);if(v)Store.docs[id]=v})}

/* ---------- Modèle ---------- */
const profile=()=>getDoc("profile",{cycleStart:"2026-10-19",coach:{prio:"",exo1:"",exo2:"",notes:"",checks:{}},wedge:{},index:[],custom:[],pars:{}});
const monthId=s=>"m-"+s.slice(0,7);
function day(s,create){const m=create?getDoc(monthId(s),{days:{}}):Store.docs[monthId(s)];if(!m)return null;if(!m.days)m.days={};if(create&&!m.days[s])m.days[s]={c:{},s:{}};return m.days[s]||null}
const allDrills=()=>DRILLS.concat((profile().custom||[]));
const drill=id=>allDrills().find(d=>d.id===id);
function allDays(){const out=[];Object.keys(Store.docs).filter(k=>k.startsWith("m-")).forEach(k=>{const d=Store.docs[k].days||{};for(const s in d)out.push([s,d[s]])});return out.sort((a,b)=>a[0]<b[0]?-1:1)}
function rounds(){let r=[];Object.keys(Store.docs).filter(k=>k.startsWith("r-")).forEach(k=>r=r.concat(Store.docs[k].list||[]));return r.sort((a,b)=>a.date<b.date?1:-1)}
function scoresOf(id){const out=[];allDays().forEach(([s,d])=>((d.s||{})[id]||[]).forEach(v=>out.push({d:s,v})));return out}
function best(id){const dr=drill(id);const sc=scoresOf(id).map(x=>x.v);if(!sc.length)return null;return dr&&dr.type==="low"?Math.min(...sc):Math.max(...sc)}
function isDone(id,s){const d=day(s);return!!(d&&((d.c||{})[id]||((d.s||{})[id]||[]).length))}
function toggle(id,s){const d=day(s,true);d.c=d.c||{};if(d.c[id])delete d.c[id];else d.c[id]=1;save(monthId(s));render()}
function addScore(id,v,s){s=s||today();const prev=best(id);const dr=drill(id);const d=day(s,true);d.s=d.s||{};(d.s[id]=d.s[id]||[]).push(v);d.c=d.c||{};d.c[id]=1;save(monthId(s));
  const rec=prev===null||(dr.type==="low"?v<prev:v>prev);toast(rec&&prev!==null?"Nouveau record : "+v:"Score enregistré : "+v);render();return rec}

function cycleWeek(s){const n=Math.floor(daysBetween(profile().cycleStart,s)/7);return((n%4)+4)%4}
function sessionFor(s){const w=cycleWeek(s),dow=parse(s).getDay();
  if(w===3&&(dow===1||dow===2))return"T";if(w===0&&dow===3)return"K";
  return{1:"A",2:"B",3:"C",4:"D",5:"M",6:"E",0:"E"}[dow]}
function sessionIds(k,s){let ids=SESSIONS[k].ids.slice();if(k==="E"&&cycleWeek(s)===2)ids.push("mpire");return ids}

function stats(){
  const days=allDays();let checks=0,scores=0,putt=0;
  days.forEach(([s,d])=>{const ids=new Set([...Object.keys(d.c||{}),...Object.keys(d.s||{})]);checks+=ids.size;ids.forEach(i=>{const dr=drill(i);if(dr&&dr.cat==="putt")putt++});for(const k in d.s||{})scores+=d.s[k].length});
  const rs=rounds();const idx=profile().index||[];
  const xp=checks*10+scores*5+rs.length*30+idx.length*10;
  // série
  let streak=0,cur=today();const has=s=>{const d=day(s);return d&&(Object.keys(d.c||{}).length||Object.keys(d.s||{}).length)};
  if(!has(cur))cur=addDays(cur,-1);while(has(cur)){streak++;cur=addDays(cur,-1)}
  let bestStreak=0,run=0,prev=null;days.forEach(([s,d])=>{if(!(Object.keys(d.c||{}).length||Object.keys(d.s||{}).length))return;run=prev&&daysBetween(prev,s)===1?run+1:1;prev=s;bestStreak=Math.max(bestStreak,run)});
  // records battus
  let records=0;const seen={};days.forEach(([s,d])=>{for(const k in d.s||{}){const dr=drill(k);d.s[k].forEach(v=>{if(seen[k]!==undefined&&(dr&&dr.type==="low"?v<seen[k]:v>seen[k]))records++;if(seen[k]===undefined||(dr&&dr.type==="low"?v<seen[k]:v>seen[k]))seen[k]=v})}});
  const lvl=Math.min(LEVELS.length,Math.floor(xp/400)+1);
  return{xp,lvl,checks,putt,streak,bestStreak,records,rounds:rs.length,idx};
}

function roundStats(r){let fwO=0,fw=0,gir=0,putts=0,udO=0,ud=0,tot=0,par=0;
  r.holes.forEach(h=>{tot+=h.score;par+=h.par;putts+=h.putts;const g=h.score-h.putts<=h.par-2;if(g)gir++;else{udO++;if(h.score<=h.par)ud++}if(h.par>=4&&h.fw!==null){fwO++;if(h.fw)fw++}});
  return{tot,par,gir,putts,fwO,fw,udO,ud,n:r.holes.length}}
function mark(score,par){const d=score-par;return d<=-2?"eagle":d===-1?"bird":d===1?"bog":d>=2?"dbl":""}

    <div class="pills">${x.fwO?`<span class="pill">Fairways ${x.fw}/${x.fwO}</span>`:""}<span class="pill">GIR ${x.gir}/${x.n}</span><span class="pill">${x.putts} putts</span><span class="pill">Up & down ${x.ud}/${x.udO}</span></div>
    <button class="link" data-delround="${r.id}" style="align-self:flex-start;color:var(--red)">Supprimer</button></div>`}).join("")}</div>`:

function indexChart(idx){
  if(idx.length<2)return `<p class="note" style="margin:0">${idx.length?"Ajoute un 2e index pour voir la courbe.":"Note ton index dès que tu l'as. La courbe apparaît à partir de 2 valeurs."}</p>`;
  const W=320,H=150,l=30,r=10,t=10,b=24;const vs=idx.map(x=>x.v).concat([5.4]);let mn=Math.floor(Math.min(...vs)),mx=Math.ceil(Math.max(...vs));if(mx===mn)mx++;
  const t0=parse(idx[0].d)*1,t1=parse(idx[idx.length-1].d)*1||t0+1;const X=d=>l+(W-l-r)*((parse(d)-t0)/((t1-t0)||1));const Y=v=>t+(H-t-b)*((v-mn)/(mx-mn));
  const ticks=[mn,Math.round((mn+mx)/2),mx];
  const pts=idx.map(x=>`${X(x.d).toFixed(1)},${Y(x.v).toFixed(1)}`).join(" ");const L=idx[idx.length-1];
  return `<div class="scroll"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Évolution de l'index">
   ${ticks.map(v=>`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${l-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`).join("")}
   <line x1="${l}" x2="${W-r}" y1="${Y(5.4)}" y2="${Y(5.4)}" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${W-r}" y="${Y(5.4)-5}" text-anchor="end">objectif 5,4</text>
   <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
   <circle cx="${X(L.d)}" cy="${Y(L.v)}" r="5.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
   <text x="${l}" y="${H-6}">${fmtShort(idx[0].d)}</text><text x="${W-r}" y="${H-6}" text-anchor="end">${fmtShort(L.d)}</text></svg></div>`;
}

/* ---------- Fiches ---------- */
function sheet(html){const bg=document.createElement("div");bg.className="sheet-bg";bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  bg.addEventListener("click",e=>{if(e.target===bg)bg.remove()});document.body.appendChild(bg);return bg}
function openRoutine(id){
  const dr=drill(id),steps=routineSteps(dr.routine);let i=-1,left=0,timer=null,paused=false,lock=null,ac=null;
  const beep=()=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=660;g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.5);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.5)}catch(e){}};
  const bg=sheet("");const sh=bg.querySelector(".sheet");
  const stop=()=>{clearInterval(timer);timer=null;try{lock&&lock.release()}catch(e){}};
  const close=()=>{stop();bg.remove()};
  bg.addEventListener("click",e=>{if(e.target===bg)stop()});
  const finish=()=>{stop();if(!isDone(id,today())){const d=day(today(),true);d.c=d.c||{};d.c[id]=1;save(monthId(today()))}render();
    sh.innerHTML=`<div class="eyebrow">${esc(dr.name)}</div><h2>Terminé</h2><p style="margin:0">${dr.routine==="soir"?"Pose le téléphone et dors bien.":"Belle séance. Les hanches et le haut du dos te diront merci au prochain parcours."}</p><button class="btn" data-x="1">Fermer</button>`;sh.querySelector("[data-x]").onclick=close};
  const tick=()=>{if(paused)return;left--;if(left<=0){beep();go(i+1)}else upd()};
  const go=n=>{if(n>=steps.length){finish();return}i=Math.max(0,n);left=steps[i].s;draw()};
  const upd=()=>{const el=sh.querySelector("#rtLeft");if(el)el.textContent=Math.floor(left/60)+":"+pad(left%60)};
  const draw=()=>{
    if(i<0){sh.innerHTML=`<div class="spread"><div class="eyebrow">${CATS.etir}</div><button class="x" data-x="1">Fermer</button></div>
      <h2>${esc(dr.name)}</h2><p style="margin:0">${esc(dr.desc)}</p>
      <div class="list">${ROUTINES[dr.routine].steps.map((x,j)=>`<div class="item"><span class="rec" style="font-size:16px;min-width:22px;text-align:left">${j+1}</span><div style="flex:1;min-width:0"><b>${esc(x.n)}</b><div class="note">${x.s} s${x.sides?" par côté":""}</div></div></div>`).join("")}</div>
      <button class="btn" id="rtGo">Commencer · ${routineMin(dr.routine)} min</button>
      ${isDone(id,today())?"":`<button class="btn ghost" id="rtMark">Déjà fait, juste cocher</button>`}`;
      sh.querySelector("[data-x]").onclick=close;
      $("#rtGo").onclick=async()=>{beep();try{lock=await navigator.wakeLock.request("screen")}catch(e){}go(0);timer=setInterval(tick,1000)};
      const mk=$("#rtMark");if(mk)mk.onclick=()=>{toggle(id,today());close()};return}
    const st=steps[i],nx=steps[i+1];
    sh.innerHTML=`<div class="spread"><div class="eyebrow">${i+1} / ${steps.length}</div><button class="x" data-x="1">Arrêter</button></div>
      ${puttLine(i,steps.length)}
      <div><h2>${esc(st.n)}</h2>${st.side?`<div class="eyebrow" style="color:var(--accent);margin-top:6px">${st.side}</div>`:""}</div>
      <div class="counter"><div class="big" id="rtLeft">${Math.floor(left/60)}:${pad(left%60)}</div></div>
      <p style="margin:0">${esc(st.cue)}</p>
      <p class="note" style="margin:0">${nx?"Ensuite : "+esc(nx.n)+(nx.side?" · "+nx.side.toLowerCase():""):"Dernière posture"}</p>
      <div class="two"><button class="btn ghost" id="rtPrev" ${i===0?"disabled":""}>Précédent</button><button class="btn ghost" id="rtNext">${nx?"Suivant":"Terminer"}</button></div>
      <button class="btn" id="rtPause">${paused?"Reprendre":"Pause"}</button>`;
    sh.querySelector("[data-x]").onclick=close;
    $("#rtPrev").onclick=()=>go(i-1);$("#rtNext").onclick=()=>go(i+1);$("#rtPause").onclick=()=>{paused=!paused;draw()};
  };draw();
}
function openDrill(id){
  if(drill(id).type==="routine"){openRoutine(id);return}
  const dr=drill(id);const s=today();const hist=scoresOf(id).slice(-6).reverse();const b=best(id);
  let body="";
  if(dr.type==="streak"){body=`<div class="counter"><div class="eyebrow" id="cLbl">${dr.lives?"Vies : "+dr.lives:"D'affilée"}</div><div class="big" id="cNum">0</div><div class="note" id="cSub">${dr.max?"Objectif "+dr.max+" · ":""}Record ${b??"–"}</div></div>
    <div class="two"><button class="btn red" id="cMiss">Raté</button><button class="btn green" id="cHit">Rentré</button></div>
    <button class="btn ghost" id="cEnd">Terminer et enregistrer</button>`}
  else if(dr.type==="score"||dr.type==="low"){body=`<div class="row"><input type="number" inputmode="numeric" id="scIn" placeholder="${dr.max?"Score sur "+dr.max:"Score"}" style="flex:1;min-width:0"><button class="btn acc" id="scSave">Enregistrer</button></div>`}
  else{body=`<button class="btn ${isDone(id,s)?"ghost":"acc"}" id="ckBtn">${isDone(id,s)?"Décocher pour aujourd'hui":"Fait aujourd'hui"}</button>`}
  const bg=sheet(`<div class="spread"><div class="eyebrow">${CATS[dr.cat]}</div><button class="x" data-x="1">Fermer</button></div>
   <h2>${esc(dr.name)}</h2><p style="margin:0">${esc(dr.desc||"")}</p>${body}
   ${dr.type!=="check"?`<div><div class="eyebrow">Derniers scores</div><p class="note" style="margin:4px 0 0">${hist.length?hist.map(h=>fmtShort(h.d)+" : <b>"+h.v+"</b>").join(" · "):"Aucun score encore."}</p></div>`:""}
   ${dr.custom?`<button class="btn ghost" id="delDrill">Supprimer cet exo</button>`:""}`);
  const close=()=>bg.remove();bg.querySelector("[data-x]").onclick=close;
  if(dr.type==="streak"){let run=0,bestRun=0,lives=dr.lives||0,made=0;const upd=()=>{$("#cNum").textContent=dr.lives?made:run;$("#cLbl").textContent=dr.lives?"Vies : "+lives:"D'affilée";$("#cSub").textContent=(dr.max?"Objectif "+dr.max+" · ":"")+"Meilleure série du jour "+bestRun+" · Record "+(b??"–")};
    $("#cHit").onclick=()=>{if(dr.lives&&lives<=0)return;run++;made++;bestRun=Math.max(bestRun,dr.lives?made:run);upd();if(dr.max&&run>=dr.max){toast("Objectif atteint : "+run+" d'affilée")}};
    $("#cMiss").onclick=()=>{if(dr.lives){lives=Math.max(0,lives-1);if(lives===0)toast("Plus de vies. Score : "+made)}else run=0;upd()};
    $("#cEnd").onclick=()=>{const v=dr.lives?made:bestRun;if(v>0)addScore(id,v,s);else toggle(id,s);close()}}
  else if(dr.type==="score"||dr.type==="low"){$("#scSave").onclick=()=>{const v=Number($("#scIn").value);if($("#scIn").value===""||isNaN(v)||v<0){toast("Entre un score");return}if(dr.max&&v>dr.max){toast("Maximum "+dr.max);return}addScore(id,v,s);close()}}
  else $("#ckBtn").onclick=()=>{toggle(id,s);close()};
  const del=bg.querySelector("#delDrill");if(del)del.onclick=()=>{const P=profile();P.custom=(P.custom||[]).filter(x=>x.id!==id);save("profile");close();render()};
}
function newDrill(){
  const bg=sheet(`<div class="spread"><div class="eyebrow">Nouvel exo</div><button class="x" data-x="1">Fermer</button></div><h2>Mon exo</h2>
   <label class="f">Nom<input type="text" id="ndName" placeholder="Ex : 50 putts à 1,5 m"></label>
   <label class="f">Catégorie<select id="ndCat">${Object.keys(CATS).map(c=>`<option value="${c}" ${c===exoCat?"selected":""}>${CATS[c]}</option>`).join("")}</select></label>
   <label class="f">Type<select id="ndType"><option value="check">À cocher</option><option value="score">Score (plus haut = mieux)</option><option value="low">Score (plus bas = mieux)</option><option value="streak">Compteur d'affilée</option></select></label>
   <label class="f">Score max ou objectif (facultatif)<input type="number" id="ndMax"></label>
   <label class="f">Comment on le fait<textarea id="ndDesc"></textarea></label>
   <button class="btn acc" id="ndSave">Créer l'exo</button>`);
  bg.querySelector("[data-x]").onclick=()=>bg.remove();
  $("#ndSave").onclick=()=>{const name=$("#ndName").value.trim();if(!name){toast("Donne un nom à l'exo");return}
    const P=profile();P.custom=P.custom||[];const m=Number($("#ndMax").value)||null;
    P.custom.push({id:"c"+Date.now().toString(36),cat:$("#ndCat").value,name,type:$("#ndType").value,max:m,desc:$("#ndDesc").value.trim(),custom:1});
    exoCat=$("#ndCat").value;save("profile");bg.remove();render();toast("Exo créé")}
}
function newRound(){
  const P=profile();const courses=["Frégate","La Salette (compact)"];
  const st={date:today(),course:"Frégate",n:18,holes:[],i:0,phase:"setup"};
  const bg=sheet("");const sh=bg.querySelector(".sheet");
  const initHoles=()=>{const pars=(P.pars||{})[st.course]||[];st.holes=Array.from({length:st.n},(_,i)=>{const par=pars[i]||4;return{par,score:par,putts:2,fw:par>=4?null:null}})};
  const draw=()=>{
    if(st.phase==="setup"){sh.innerHTML=`<div class="spread"><div class="eyebrow">Nouvelle carte</div><button class="x" data-x="1">Fermer</button></div><h2>Le parcours</h2>
      <label class="f">Date<input type="date" id="rDate" value="${st.date}"></label>
      <div class="eyebrow">Parcours</div><div class="chips">${courses.concat(Object.keys(P.pars||{}).filter(c=>!courses.includes(c))).map(c=>`<button class="chip ${c===st.course?"on":""}" data-course="${esc(c)}">${esc(c)}</button>`).join("")}</div>
      <label class="f">Ou un autre parcours<input type="text" id="rOther" placeholder="Nom du parcours"></label>
      <div class="eyebrow">Trous</div><div class="chips">${[6,9,18].map(n=>`<button class="chip ${n===st.n?"on":""}" data-n="${n}">${n} trous</button>`).join("")}</div>
      <button class="btn acc" id="rGo">Commencer</button>`;
      sh.querySelectorAll("[data-course]").forEach(b=>b.onclick=()=>{st.course=b.dataset.course;if(st.course.startsWith("La Salette"))st.n=6;draw()});
      sh.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{st.n=+b.dataset.n;draw()});
      $("#rGo").onclick=()=>{const o=$("#rOther").value.trim();if(o)st.course=o;st.date=$("#rDate").value||today();initHoles();st.phase="hole";draw()};}
    else{const h=st.holes[st.i];let tot=0,par=0;st.holes.forEach((x,j)=>{if(j<=st.i){tot+=x.score;par+=x.par}});
      sh.innerHTML=`<div class="spread"><div class="eyebrow">${esc(st.course)} · ${tot} (${tot-par>0?"+":""}${tot-par===0?"par":tot-par})</div><button class="x" data-x="1">Fermer</button></div>
      <div class="scroll"><table class="sc"><tr>${st.holes.map((x,j)=>`<th>${j+1}</th>`).join("")}</tr><tr>${st.holes.map((x,j)=>`<td><span class="mk ${j===st.i?"cur":(j<st.i?mark(x.score,x.par):"")}">${j<=st.i?x.score:"·"}</span></td>`).join("")}</tr></table></div>
      <h2>Trou ${st.i+1}</h2>
      <div><div class="eyebrow">Par</div><div class="chips">${[3,4,5].map(p=>`<button class="chip ${p===h.par?"on":""}" data-par="${p}">Par ${p}</button>`).join("")}</div></div>
      <div><div class="eyebrow">Score</div><div class="stepper"><button data-sc="-1" aria-label="Moins">−</button><b>${h.score}</b><button data-sc="1" aria-label="Plus">+</button></div></div>
      <div><div class="eyebrow">Putts</div><div class="stepper"><button data-pt="-1" aria-label="Moins">−</button><b>${h.putts}</b><button data-pt="1" aria-label="Plus">+</button></div></div>
      ${h.par>=4?`<div><div class="eyebrow">Fairway</div><div class="chips"><button class="chip ${h.fw===true?"on":""}" data-fw="1">Touché</button><button class="chip ${h.fw===false?"on":""}" data-fw="0">Raté</button></div></div>`:""}
      <div class="two"><button class="btn ghost" id="hPrev" ${st.i===0?"disabled":""}>Trou précédent</button>${st.i<st.n-1?`<button class="btn acc" id="hNext">Trou suivant</button>`:`<button class="btn green" id="hSave">Enregistrer la carte</button>`}</div>`;
      sh.querySelectorAll("[data-par]").forEach(b=>b.onclick=()=>{const p=+b.dataset.par;if(h.score===h.par)h.score=p;h.par=p;if(p===3)h.fw=null;draw()});
      sh.querySelectorAll("[data-sc]").forEach(b=>b.onclick=()=>{h.score=Math.max(1,h.score+ +b.dataset.sc);if(h.putts>=h.score)h.putts=Math.max(0,h.score-1);draw()});
      sh.querySelectorAll("[data-pt]").forEach(b=>b.onclick=()=>{h.putts=Math.max(0,Math.min(h.score-1,h.putts+ +b.dataset.pt));draw()});
      sh.querySelectorAll("[data-fw]").forEach(b=>b.onclick=()=>{h.fw=b.dataset.fw==="1";draw()});
      const pv=$("#hPrev");if(pv)pv.onclick=()=>{st.i--;draw()};const nx=$("#hNext");if(nx)nx.onclick=()=>{st.i++;draw()};
      const sv=$("#hSave");if(sv)sv.onclick=()=>{const y="r-"+st.date.slice(0,4);const doc=getDoc(y,{list:[]});doc.list=doc.list||[];
        doc.list.push({id:"r"+Date.now().toString(36),date:st.date,course:st.course,holes:st.holes});save(y);
        P.pars=P.pars||{};const cur=P.pars[st.course]||[];P.pars[st.course]=st.holes.map((x,j)=>x.par||cur[j]);save("profile");
        const d=day(st.date,true);d.c=d.c||{};d.c.mstats=1;save(monthId(st.date));bg.remove();tab="parcours";render();toast("Carte enregistrée · +30 pts")};}
    sh.querySelector("[data-x]").onclick=()=>bg.remove();
  };draw();
}

/* ---------- Événements ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.classList.contains("tab")){tab=t.dataset.t;render();window.scrollTo(0,0);return}
  if(t.closest(".sheet"))return;
  const d=t.dataset;
  if(d.check){const dr=drill(d.check);if(dr.type!=="check")openDrill(d.check);else toggle(d.check,today())}
  else if(d.open)openDrill(d.open);
  else if(d.sess){pickSession=d.sess===sessionFor(today())?null:d.sess;render()}
  else if(d.go){tab=d.go;render();window.scrollTo(0,0)}
  else if(d.cat){exoCat=d.cat;render()}
  else if(d.accent!==undefined)setTheme({accent:d.accent||null});
  else if(d.mode)setTheme({mode:d.mode});
  else if(d.newdrill)newDrill();
  else if(d.newround)newRound();
  else if(d.delround){if(t.dataset.confirm){Object.keys(Store.docs).filter(k=>k.startsWith("r-")).forEach(k=>{const doc=Store.docs[k];const n=(doc.list||[]).length;doc.list=(doc.list||[]).filter(r=>r.id!==d.delround);if(doc.list.length!==n)save(k)});render()}else{t.dataset.confirm="1";t.textContent="Confirmer la suppression";t.classList.add("red")}}
  else if(d.addidx){const v=parseFloat(String($("#idxVal").value).replace(",","."));if(isNaN(v)){toast("Entre un index");return}const P=profile();P.index=P.index||[];P.index.push({d:$("#idxDate").value||today(),v});save("profile");render();toast("Index ajouté")}
  else if(d.cchk!==undefined){const P=profile();P.coach.checks=P.coach.checks||{};const a=P.coach.checks[P.cycleStart]=P.coach.checks[P.cycleStart]||[];a[+d.cchk]=!a[+d.cchk];save("profile");render()}
});
document.addEventListener("change",e=>{const t=e.target;const P=profile();
  if(t.dataset.wedge!==undefined){P.wedge=P.wedge||{};P.wedge[t.dataset.wedge]=t.value===""?null:Number(t.value);save("profile")}
  else if(t.dataset.coach){P.coach[t.dataset.coach]=t.value;save("profile")}
  else if(t.id==="accPick"){setTheme({accent:t.value})}
  else if(t.id==="cyc"&&t.value){P.cycleStart=t.value;pickSession=null;save("profile");render()}
});

/* ---------- Démarrage ---------- */
loadLocal();render();
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;const uid=await user.id();if(!uid)return;
    Store.db=db;Store.col=db.collection("data/users/"+uid);
    const local=JSON.parse(JSON.stringify(Store.docs));Store.mode="db";let first=true;
    Store.col.onSnapshot(snap=>{
      snap.docs.forEach(doc=>{if(!Store.dirty[doc.id]&&doc.exists)Store.docs[doc.id]=JSON.parse(JSON.stringify(doc.data()))});
      if(first){first=false;// reprend les données saisies hors ligne s'il n'y a rien en ligne
        if(snap.empty&&Object.keys(local).length){Object.keys(local).forEach(k=>{Store.docs[k]=local[k];save(k)})}}
      if(!document.querySelector(".sheet-bg")&&!(document.activeElement&&document.activeElement.matches("input,textarea,select")))render();
    },err=>{Store.mode="local"});
  }catch(e){}
})();
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{}))}</script>
